services:
  rpg4pov:
    build: .
    image: rpg4pov:issue6
    container_name: rpg4pov
    ports:
      - "3002:3002"
    volumes:
      - rpg4pov-data:/app/data
    restart: unless-stopped
    # 默认 AGENT_RUNNER 不设（route.ts 默认 fake）。
    # Pi 候选路径：用 docker-compose -f docker-compose.yml -f docker-compose.pi.yml up
    # Claude A/B 基线：用 docker-compose -f docker-compose.yml -f docker-compose.claude.yml up

volumes:
  rpg4pov-data:
